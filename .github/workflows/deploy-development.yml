name: Deploy Frontend Demo

on:
  push:
    branches:
      - HAULHUB_DEV

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend on VPS
        run: |
          set -Ee -o pipefail
          trap 'echo "Deployment failed in GitHub Actions line $LINENO while running: $BASH_COMMAND"' ERR

          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -Ee -o pipefail
            trap 'echo "Deployment failed on VPS line $LINENO while running: $BASH_COMMAND"' ERR

            echo "Loading Node via NVM..."

            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "NVM not found at $NVM_DIR/nvm.sh"
              exit 1
            fi

            nvm install 24.15.0
            nvm use 24.15.0

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            echo "Going to haulhub_reactjs folder..."

            cd /var/www/HaulHub_ReactJS

            git fetch origin HAULHUB_DEV
            git checkout HAULHUB_DEV
            git reset --hard origin/HAULHUB_DEV

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            rm -rf build
            npm run build

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Frontend deployed successfully"
          EOF